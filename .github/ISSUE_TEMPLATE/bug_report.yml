name: Bug report
description: Something in an ECRM process, tool, report or document isn't working as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What's wrong
      description: What did you expect to happen, and what actually happened?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - BAU
        - CEP
        - Deliverability
        - SCRAM
        - Other / not sure
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where this happens
      description: Tool, report, process step, or a link.
    validations:
      required: false
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Who or what is affected, and how urgent is this?
    validations:
      required: false
  - type: textarea
    id: workaround
    attributes:
      label: Workaround (if any)
    validations:
      required: false
